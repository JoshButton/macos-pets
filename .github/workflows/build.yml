name: build

on:
  # Only run when build inputs change: docs, licences, and repo meta don't
  # need a 15-minute macOS runner. Tags bypass path filters, so `v*` tags
  # always run the release job even if the tagged commit is docs-only.
  push:
    tags:
      - "v*"
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Assets/**"
      - "install.sh"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Assets/**"
      - "install.sh"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Check upstream artwork intact
        run: |
          test -f Assets/vscode-pets/ATTRIBUTION.md
          test -f Assets/vscode-pets/LICENSE.upstream
          test "$(find Assets/vscode-pets/media -name '*_8fps.gif' | wc -l)" -ge 360

      - name: Select Swift toolchain
        # Package.swift needs swift-tools 6.0 (Swift 6+). The runner default
        # Xcode may be older, so pick the newest installed Xcode and show it.
        run: |
          swift --version
          cand=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "xcode: $cand"
          sudo xcode-select -s "$cand"
          swift --version

      - name: Build (debug)
        # No pipes here: a masked build failure is exactly how a missing
        # binary once reached the test step unnoticed.
        run: swift build

      - name: Behavioural checks
        run: ./.build/debug/macos-pets --selftest

      - name: Regression-detection checks
        run: ./.build/debug/macos-pets --selftest --verify-catches

      - name: Render check (offscreen)
        run: ./.build/debug/macos-pets --render-check

      - name: Assemble .app bundle
        run: ./install.sh --bundle-only ./dist

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: macOS-Pets-app
          path: dist/macOS Pets.app

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Swift toolchain
        run: |
          cand=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$cand"

      - name: Assemble .app bundle
        run: ./install.sh --bundle-only ./dist

      - name: Zip for distribution
        run: ditto -c -k --keepParent "dist/macOS Pets.app" "dist/macOS-Pets.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/macOS-Pets.zip
          generate_release_notes: true
