name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift toolchain
        run: |
          cand=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$cand"
          swift --version

      - name: Checks
        run: |
          swift build
          ./.build/debug/macos-pets --selftest
          ./.build/debug/macos-pets --selftest --verify-catches
          ./.build/debug/macos-pets --render-check

      - name: Assemble .app bundle
        run: ./install.sh --bundle-only ./dist

      - name: Zip for distribution
        run: ditto -c -k --keepParent "dist/macOS Pets.app" "dist/macOS-Pets.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/macOS-Pets.zip
          generate_release_notes: true
